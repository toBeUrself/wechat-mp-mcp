services:
  wechat-mp-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: wechat-mp-mcp:local
    env_file:
      - .env
    environment:
      WECHAT_TRANSPORT: http
      WECHAT_HTTP_BIND: 0.0.0.0:8000
      WECHAT_MEDIA_ROOT: /data/media
    ports:
      - "${WECHAT_HTTP_PORT:-8000}:8000"
    volumes:
      - ./data/media:/data/media:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
